[project]
name = "aislop"
version = "1.0.0"
description = "A bounded, read-only workspace observation MCP server"
readme = "README.md"
license = "MIT"
authors = [
    { name = "AISLOP contributors" }
]
keywords = ["mcp", "model-context-protocol", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12,<3.14"
dependencies = ["mcp[cli]>=1.13.1,<2"]

[project.scripts]
aislop = "aislop.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9"]
