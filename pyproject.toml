[project]
name = "aislop-sdr"
dynamic = ["version"]
description = "A bounded, read-only workspace observation MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AISLOP contributors" }
]
keywords = ["mcp", "model-context-protocol", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12,<3.14"
dependencies = ["mcp[cli]>=1.13.1,<3"]

[project.urls]
Homepage = "https://github.com/BoondockMark/AISLOP"
Documentation = "https://github.com/BoondockMark/AISLOP/blob/main/README.md"
Changelog = "https://github.com/BoondockMark/AISLOP/blob/main/CHANGELOG.md"
Source = "https://github.com/BoondockMark/AISLOP"
Issues = "https://github.com/BoondockMark/AISLOP/issues"

[project.scripts]
aislop = "aislop.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
# This is the sole release version. Package metadata and the CLI both read it.
path = "src/aislop/__init__.py"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "mypy>=1.17,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "twine>=6.1,<8",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["src/aislop"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unreachable = true
