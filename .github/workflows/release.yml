name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/validate_version.py --tag "${{ github.ref_name }}" dist/*

  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: test -z "$(git status --porcelain)"
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/validate_dependencies.py && uv pip check
      - run: uv run pip-audit -r requirements.lock
      - name: Security documentation gate
        run: test -s SECURITY.md && test -s docs/security.md && test -s RELEASING.md
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv build
      - run: uv run python -m twine check dist/*
      - run: uv run python scripts/validate_release_artifacts.py dist/*
      - run: uv run python scripts/validate_version.py --tag "${{ github.ref_name }}" dist/*

  build:
    name: Clean release build
    needs: [test, gates]
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: test -z "$(git status --porcelain)"
      - run: uv sync --all-groups
      - id: version
        shell: bash
        run: |
          uv run python scripts/validate_version.py --tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: uv build
      - run: uv run python -m twine check dist/*
      - run: uv run python scripts/validate_release_artifacts.py dist/*
      - run: uv run python scripts/validate_version.py --tag "$GITHUB_REF_NAME" dist/*
      - name: Smoke test the exact wheel
        run: |
          uv venv --python 3.12 .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
          test "$(.package-venv/bin/aislop --version)" = "aislop ${GITHUB_REF_NAME#v}"
      - name: Generate CycloneDX SBOM
        run: uvx --from 'cyclonedx-bom==7.1.0' cyclonedx-py requirements requirements.lock --output-format JSON --output-file dist/aislop-${GITHUB_REF_NAME#v}.cdx.json
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  provenance:
    name: Attest provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS

  publish:
    name: Publish package and release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.prerelease == 'true' && 'prerelease' || 'release' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Select registry artifacts
        run: mkdir packages && cp dist/*.whl dist/*.tar.gz packages/
      - name: Publish exact artifacts with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/
          repository-url: ${{ needs.build.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
      - name: Create matching GitHub release and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "${{ needs.build.outputs.prerelease }}" == true ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
