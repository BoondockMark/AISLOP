name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv build

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Formatting
        run: uv run ruff format --check .
      - name: Linting
        run: uv run ruff check .
      - name: Type checking
        run: uv run mypy
      - name: Locked dependency validation
        run: |
          uv run python scripts/validate_dependencies.py
          uv pip check
      - name: Threat-model release gate
        run: test -s SECURITY.md && test -s docs/security.md
      - name: Dependency vulnerability audit
        run: uv run pip-audit -r requirements.lock
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package build and metadata validation
        run: |
          uv build
          uv run python -m twine check dist/*
          uv run python scripts/validate_release_artifacts.py dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, quality]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Validate release licensing
        run: uv run python scripts/validate_release_artifacts.py dist/*
      - name: Publish only after every required job passes
        run: uv publish
